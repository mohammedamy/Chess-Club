      radial-gradient(ellipse at top left,rgba(184,137,63,.08),transparent 50%),
      radial-gradient(ellipse at bottom right,rgba(31,58,38,.08),transparent 50%),
      var(--cream);
    background-attachment:fixed;
  }
  /* Subtle paper grain */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      repeating-linear-gradient(45deg,rgba(74,44,14,.012) 0,rgba(74,44,14,.012) 1px,transparent 1px,transparent 3px),
      repeating-linear-gradient(-45deg,rgba(74,44,14,.012) 0,rgba(74,44,14,.012) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:multiply;
  }
  h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--walnut-dark);letter-spacing:-.01em}
  h1{font-size:2.6rem;line-height:1.05}
  h2{font-size:1.9rem;line-height:1.15}
  h3{font-size:1.4rem;line-height:1.25}
  h4{font-size:1.15rem;line-height:1.3}
  p{margin-bottom:.8em}
  a{color:var(--burgundy);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
  a:hover{border-bottom-color:var(--burgundy)}
  small,.small{font-size:.85rem;color:var(--ink-soft)}
  .mono{font-family:'JetBrains Mono',monospace;font-size:.92em}
  .italic{font-style:italic}

  /* Layout */
  #app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}
  .container{max-width:1280px;margin:0 auto;padding:0 2rem;width:100%}

  /* Header */
  header.site{
    background:linear-gradient(180deg,var(--walnut-dark),var(--walnut));
    color:var(--cream);
    border-bottom:3px double var(--gold);
    padding:.85rem 0;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
    position:sticky;top:0;z-index:50;
  }
  header.site .container{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.85rem;cursor:pointer}
  .brand .seal{
    width:54px;height:54px;border-radius:50%;
    background:#fff var(--logo) center/cover no-repeat;
    box-shadow:inset 0 0 0 2px var(--gold-bright),0 2px 6px rgba(0,0,0,.45);
    border:2px solid var(--cream);
    flex-shrink:0;
  }
  .brand-text .title{white-space:nowrap}
  .brand-text{display:flex;flex-direction:column;line-height:1}
  .brand-text .title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--cream);letter-spacing:.02em}
  .brand-text .sub{font-size:.72rem;letter-spacing:.3em;color:var(--gold-bright);text-transform:uppercase;margin-top:.25rem}

  nav.primary{display:flex;gap:.4rem;flex-wrap:wrap}
  nav.primary button{
    background:transparent;color:var(--cream);
    border:1px solid transparent;
    font-family:'EB Garamond',serif;font-size:.95rem;
    padding:.45rem .85rem;border-radius:2px;cursor:pointer;
    letter-spacing:.04em;transition:all .2s;
  }
  nav.primary button:hover{background:rgba(212,169,67,.12);border-color:var(--gold)}
  nav.primary button.active{background:var(--gold);color:var(--walnut-dark);border-color:var(--gold-bright);font-weight:600}

  .user-pill{
    display:flex;align-items:center;gap:.6rem;
    padding:.4rem .8rem;border:1px solid var(--gold);border-radius:2px;
    background:rgba(0,0,0,.2);
  }
  .user-pill .avatar{
    width:28px;height:28px;border-radius:50%;
    background:var(--gold);color:var(--walnut-dark);
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:.85rem;
  }
  .user-pill .name{font-size:.95rem;color:var(--cream)}
  .user-pill .rating{font-size:.78rem;color:var(--gold-bright);font-family:'JetBrains Mono',monospace}
  .user-pill button{
    background:transparent;border:none;color:var(--cream);cursor:pointer;
    font-size:.8rem;text-decoration:underline;opacity:.7;
  }
  .user-pill button:hover{opacity:1}

  /* Main */
  main{flex:1;padding:2.2rem 0 4rem}

  /* Cards */
  .card{
    background:var(--paper);
    border:1px solid var(--rule);
    box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px -12px rgba(74,44,14,.18);
    padding:1.6rem;
    position:relative;
  }
  .card.ornate{
    background:
      linear-gradient(var(--paper),var(--paper)) padding-box,
      linear-gradient(135deg,var(--gold) 0%,var(--rule) 50%,var(--gold) 100%) border-box;
    border:2px solid transparent;
  }
  .card-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1px solid var(--rule);
    padding-bottom:1rem;margin-bottom:1.2rem;
  }
  .eyebrow{
    text-transform:uppercase;letter-spacing:.32em;
    font-size:.72rem;color:var(--gold);font-weight:600;
    margin-bottom:.3rem;
  }
  .ornament{
    text-align:center;color:var(--gold);font-size:1.2rem;
    margin:1rem 0;letter-spacing:1.2em;
  }
  .ornament::before{content:"❦  ❦  ❦"}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;justify-content:center;
    background:var(--walnut);color:var(--cream);
    border:1px solid var(--walnut-dark);
    padding:.65rem 1.4rem;font-family:'EB Garamond',serif;font-size:1rem;
    cursor:pointer;letter-spacing:.04em;
    transition:all .2s;border-radius:2px;
  }
  .btn:hover{background:var(--walnut-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.gold{background:var(--gold);color:var(--walnut-dark);border-color:var(--gold-bright);font-weight:600}
  .btn.gold:hover{background:var(--gold-bright)}
  .btn.ghost{background:transparent;color:var(--walnut);border:1px solid var(--walnut)}
  .btn.ghost:hover{background:var(--walnut);color:var(--cream)}
  .btn.danger{background:var(--burgundy);border-color:var(--burgundy)}
  .btn.danger:hover{background:#3e1610}
  .btn.sm{padding:.4rem .9rem;font-size:.9rem}
  .btn.full{width:100%}

  input,select,textarea{
    background:var(--paper);
    border:1px solid var(--rule);
    padding:.55rem .75rem;
    font-family:'EB Garamond',serif;font-size:1rem;
    color:var(--ink);border-radius:2px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,63,.2)}
  label{display:block;font-size:.85rem;color:var(--ink-soft);margin-bottom:.3rem;letter-spacing:.04em;text-transform:uppercase}

  /* Grid */
  .grid{display:grid;gap:1.4rem}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:880px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
    h1{font-size:2rem}h2{font-size:1.6rem}
    .container{padding:0 1rem}
    nav.primary{font-size:.85rem}
  }

  /* Login */
  .login-stage{
    min-height:80vh;display:flex;align-items:center;justify-content:center;
  }
  .login-card{
    width:min(520px,100%);
    text-align:center;padding:2.5rem 2rem;
  }
  .login-card .crest{
    width:130px;height:130px;margin:0 auto .8rem;
    background:#fff var(--logo) center/contain no-repeat;
    border:2px solid var(--gold);
    box-shadow:0 4px 18px rgba(0,0,0,.18);
    border-radius:6px;
  }
  .login-card h1{font-size:2.1rem;line-height:1.1}
  .login-card .school-sub{
    font-family:'EB Garamond',serif;font-style:italic;
    color:var(--gold);letter-spacing:.3em;text-transform:uppercase;
    font-size:.78rem;margin-top:-.2rem;margin-bottom:.4rem;
  }
  .members-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:.7rem;margin-top:1rem;
  }
  .member-tile{
    background:var(--paper-dim);border:1px solid var(--rule);
    padding:.8rem .5rem;cursor:pointer;text-align:center;
    transition:all .2s;border-radius:2px;
  }
  .member-tile:hover{border-color:var(--gold);background:var(--paper);transform:translateY(-2px)}
  .member-tile .avatar{
    width:44px;height:44px;border-radius:50%;background:var(--walnut);
    color:var(--cream);display:flex;align-items:center;justify-content:center;
    margin:0 auto .4rem;font-weight:600;
  }
  .member-tile .nm{font-size:.92rem;color:var(--walnut-dark);font-weight:500}
  .member-tile .rt{font-size:.78rem;color:var(--gold);font-family:'JetBrains Mono',monospace}

  /* Home dashboard */
  .hero{
    background:
      linear-gradient(135deg,rgba(74,44,14,.92),rgba(42,24,8,.95)),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><path d='M0 0h30v30H0zm30 30h30v30H30z' fill='%23000' fill-opacity='.04'/></svg>");
    color:var(--cream);
    padding:3rem 2.5rem;
    border:1px solid var(--gold);
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;inset:8px;border:1px solid rgba(212,169,67,.4);pointer-events:none;
  }
  .hero h1{color:var(--cream);font-size:3rem;margin-bottom:.3rem;font-weight:400}
  .hero h1 em{color:var(--gold-bright);font-style:italic}
  .hero .sub{color:var(--gold-bright);letter-spacing:.4em;font-size:.85rem;text-transform:uppercase;margin-bottom:1.5rem}
  .hero p{color:var(--cream);max-width:60ch;font-size:1.1rem;font-style:italic;opacity:.92}
  .hero-stats{display:flex;gap:2.5rem;margin-top:2rem;flex-wrap:wrap}
  .hero-stats .stat{border-left:2px solid var(--gold);padding-left:1rem}
  .hero-stats .num{font-family:'Cormorant Garamond',serif;font-size:2.2rem;color:var(--gold-bright);line-height:1}
  .hero-stats .lbl{font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--cream);opacity:.75;margin-top:.3rem}

  .module-card{
    background:var(--paper);border:1px solid var(--rule);
    padding:1.6rem;cursor:pointer;
    transition:all .25s;
    position:relative;overflow:hidden;
    min-height:200px;display:flex;flex-direction:column;
  }
  .module-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold) 0%,var(--walnut-light) 50%,var(--gold) 100%);
  }
  .module-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px -10px rgba(74,44,14,.3)}
  .module-card .icon{
    font-size:2.4rem;color:var(--walnut);margin-bottom:.6rem;line-height:1;
  }
  .module-card h3{margin-bottom:.4rem}
  .module-card p{font-size:.95rem;color:var(--ink-soft);flex-grow:1}
  .module-card .arrow{
    margin-top:.8rem;color:var(--gold);font-weight:600;
    font-family:'JetBrains Mono',monospace;font-size:.85rem;
    letter-spacing:.1em;
  }

  /* Chess board */
  .board-frame{
    display:inline-block;
    padding:12px;
    background:linear-gradient(135deg,var(--walnut-dark),var(--walnut) 50%,var(--walnut-light));
    border-radius:4px;
    box-shadow:
      0 1px 0 rgba(212,169,67,.5) inset,
      0 0 0 1px var(--gold),
      0 8px 32px -8px rgba(0,0,0,.4);
    position:relative;
  }
  .board{
    /* explicit equal rows + columns => squares never shrink when a rank is empty */
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    /* fits within viewport on every screen so the whole board is always visible */
    --board-side:min(560px, calc(100vw - 80px), calc(100vh - 240px));
    width:var(--board-side);
    height:var(--board-side);
    border:1px solid var(--walnut-dark);
    user-select:none;
  }
  /* allow grid cells to shrink to their track size, never grow to fit a tall piece glyph */
  .square{min-width:0;min-height:0;overflow:hidden}
  .square{
    position:relative;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:clamp(28px,5.5vw,52px);
    line-height:1;transition:background-color .15s;
  }
  .square.light{background:var(--board-light)}
  .square.dark{background:var(--board-dark)}
  .square.selected{box-shadow:inset 0 0 0 4px var(--gold-bright)}
  .square.last-move{background-color:rgba(212,169,67,.35)!important}
  .square.last-move.dark{background-color:rgba(184,137,63,.55)!important}
  .square.legal::after{
    content:"";position:absolute;width:30%;height:30%;
    background:rgba(31,58,38,.45);border-radius:50%;
    pointer-events:none;
  }
  .square.legal-capture::after{
    content:"";position:absolute;inset:5%;
    border:4px solid rgba(31,58,38,.45);border-radius:50%;
    pointer-events:none;background:transparent;
  }
  .square.check{background-color:var(--check)!important;animation:pulse 1s ease-in-out infinite alternate}
  @keyframes pulse{from{box-shadow:inset 0 0 0 0 rgba(180,30,30,.6)}to{box-shadow:inset 0 0 20px 4px rgba(180,30,30,.7)}}
  .piece{
    cursor:grab;
    text-shadow:0 2px 3px rgba(0,0,0,.3);
    transition:transform .12s;
  }
  .piece.white{color:#fafafa;text-shadow:0 0 1px #000,0 0 2px #000,1px 1px 2px rgba(0,0,0,.6)}
  .piece.black{color:#1a1a1a;text-shadow:0 0 1px #fff,1px 1px 2px rgba(255,255,255,.2)}
  .square:hover .piece{transform:scale(1.06)}
  .coord{
    position:absolute;font-size:.7rem;font-family:'JetBrains Mono',monospace;
    color:var(--walnut-dark);font-weight:600;pointer-events:none;
    opacity:.55;
  }
  .coord.file{bottom:1px;right:3px}
  .coord.rank{top:1px;left:3px}
  .square.dark .coord{color:var(--cream)}

  /* Board layout with sidebar */
  .play-layout{
    display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:start;
  }
  @media(max-width:980px){.play-layout{grid-template-columns:1fr;justify-items:center}}
  /* When viewport is short, shrink piece glyphs proportionally so they fit the smaller squares */
  @media(max-height:760px){.square{font-size:clamp(22px,4.6vh,46px)}}
  .play-sidebar{min-width:300px;display:flex;flex-direction:column;gap:1rem}
  .moves-panel{
    background:var(--paper);border:1px solid var(--rule);
    padding:.9rem 1rem;max-height:280px;overflow-y:auto;
    font-family:'JetBrains Mono',monospace;font-size:.9rem;
  }
  .moves-panel h4{font-family:'Cormorant Garamond',serif;font-size:1.05rem;margin-bottom:.5rem;letter-spacing:.05em}
  .moves-list{display:grid;grid-template-columns:auto 1fr 1fr;gap:.2rem .8rem;align-items:baseline}
  .moves-list .num{color:var(--ink-soft);font-size:.82rem}
  .moves-list .move{cursor:pointer;padding:1px 4px;border-radius:2px}
  .moves-list .move:hover{background:var(--paper-dim)}
  .moves-list .move.current{background:var(--gold);color:var(--walnut-dark);font-weight:700}

  .game-info{
    background:var(--paper);border:1px solid var(--rule);padding:1rem;
    display:flex;flex-direction:column;gap:.55rem;
  }
  .player-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:.4rem 0;border-bottom:1px dashed var(--rule);
  }
  .player-row:last-child{border-bottom:none}
  .player-row .pname{font-weight:500}
  .player-row .pclock{font-family:'JetBrains Mono',monospace;color:var(--gold);font-size:.95rem}
  .player-row.active{background:linear-gradient(90deg,rgba(184,137,63,.18),transparent);padding-left:.5rem;border-radius:2px}
  .player-row .turn-marker{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 6px var(--gold);
    margin-right:.4rem;
  }
  .player-row:not(.active) .turn-marker{visibility:hidden}

  .game-controls{display:flex;gap:.5rem;flex-wrap:wrap}
  .game-controls .btn{flex:1;min-width:90px}

  /* Status banner */
  .status-banner{
    background:linear-gradient(135deg,var(--forest-dark),var(--forest));
    color:var(--cream);
    padding:.9rem 1.2rem;
    border-left:4px solid var(--gold);
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:1.1rem;
    letter-spacing:.04em;
  }
  .status-banner.win{background:linear-gradient(135deg,var(--forest-dark),var(--forest))}
  .status-banner.loss{background:linear-gradient(135deg,#3a0e0a,var(--burgundy))}
  .status-banner.draw{background:linear-gradient(135deg,var(--walnut-dark),var(--walnut))}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(26,20,16,.7);
    z-index:100;display:flex;align-items:center;justify-content:center;
    padding:1rem;backdrop-filter:blur(3px);
  }
  .modal{
    background:var(--paper);max-width:560px;width:100%;
    border:2px solid var(--gold);
    box-shadow:0 0 0 8px rgba(212,169,67,.15),0 24px 60px rgba(0,0,0,.5);
    padding:2rem;
  }
  .modal h2{margin-bottom:.6rem}
  .modal-close{
    background:none;border:none;color:var(--walnut);cursor:pointer;
    font-size:1.4rem;float:right;padding:0;line-height:1;
  }

  /* Lists */
  .item-list{display:flex;flex-direction:column;gap:.6rem}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--paper);border:1px solid var(--rule);
    padding:.9rem 1.1rem;cursor:pointer;
    transition:all .15s;
  }
  .list-item:hover{border-color:var(--gold);background:var(--paper-dim)}
  .list-item .meta{display:flex;flex-direction:column;gap:.2rem}
  .list-item h4{margin:0}
  .list-item .tag{
    display:inline-block;background:var(--walnut);color:var(--cream);
    font-size:.7rem;letter-spacing:.15em;padding:.15rem .55rem;
    text-transform:uppercase;border-radius:2px;
    font-family:'JetBrains Mono',monospace;
  }
  .list-item .tag.gold{background:var(--gold);color:var(--walnut-dark)}
  .list-item .tag.green{background:var(--forest)}
  .list-item .tag.burg{background:var(--burgundy)}

  /* Tutorial step display */
  .tutorial-text{
    background:var(--paper);border:1px solid var(--rule);
    padding:1.2rem 1.4rem;
    border-left:4px solid var(--gold);
  }
  .tutorial-text .step-counter{
    font-family:'JetBrains Mono',monospace;font-size:.78rem;
    color:var(--gold);letter-spacing:.2em;text-transform:uppercase;
    margin-bottom:.4rem;
  }
  .tutorial-text .move-played{
    font-family:'JetBrains Mono',monospace;font-size:1.3rem;
    color:var(--walnut-dark);font-weight:600;margin-bottom:.5rem;
  }
  .tutorial-text p{font-size:1.02rem;line-height:1.6}
  .tutorial-controls{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}

  /* Leaderboard table */
  table.leaderboard{
    width:100%;border-collapse:collapse;
    background:var(--paper);border:1px solid var(--rule);
  }
  table.leaderboard th,table.leaderboard td{
    padding:.7rem 1rem;text-align:left;
    border-bottom:1px solid var(--rule);
  }
  table.leaderboard th{
    background:var(--walnut);color:var(--cream);
    text-transform:uppercase;letter-spacing:.15em;font-size:.78rem;
    font-weight:500;
  }
  table.leaderboard tr:hover{background:var(--paper-dim)}
  table.leaderboard td.rank{
    font-family:'JetBrains Mono',monospace;color:var(--gold);
    font-weight:600;width:60px;
  }
  table.leaderboard td.rating{font-family:'JetBrains Mono',monospace;font-weight:600}
  table.leaderboard tr.you td{background:rgba(212,169,67,.18)}

  /* Tactics puzzle */
  .puzzle-prompt{
    text-align:center;padding:1rem 1.4rem;
    background:linear-gradient(135deg,var(--paper),var(--paper-dim));
    border:1px dashed var(--gold);
  }
  .puzzle-prompt .turn-flag{
    display:inline-block;padding:.2rem .8rem;background:var(--walnut);
    color:var(--cream);font-size:.78rem;letter-spacing:.2em;
    text-transform:uppercase;margin-bottom:.5rem;border-radius:2px;
  }
  .puzzle-prompt .turn-flag.white{background:var(--paper);color:var(--walnut-dark);border:1px solid var(--walnut)}
  .puzzle-prompt h4{margin-bottom:.3rem;font-size:1.3rem}
  .puzzle-feedback{
    margin-top:.8rem;padding:.7rem 1rem;border-radius:2px;
    font-family:'EB Garamond',serif;font-size:1rem;
  }
  .puzzle-feedback.correct{background:rgba(31,58,38,.15);color:var(--forest-dark);border-left:3px solid var(--forest)}
  .puzzle-feedback.wrong{background:rgba(92,32,24,.15);color:var(--burgundy);border-left:3px solid var(--burgundy)}
  .puzzle-feedback.hint{background:rgba(212,169,67,.18);color:var(--walnut-dark);border-left:3px solid var(--gold)}

  /* Engine settings */
  .level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem}
  .level-card{
    background:var(--paper);border:2px solid var(--rule);
    padding:1rem .8rem;text-align:center;cursor:pointer;
    transition:all .2s;border-radius:2px;
  }
  .level-card:hover{border-color:var(--gold)}
  .level-card.selected{border-color:var(--gold);background:linear-gradient(135deg,var(--paper),rgba(212,169,67,.18));box-shadow:inset 0 0 0 1px var(--gold)}
  .level-card .lvl-num{
    font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--walnut);line-height:1;
  }

// ----- Storage helpers (uses window.storage if available, else localStorage fallback) -----
const storage = {
  async get(key, shared=true){
    try{
      if(window.storage){
        const r = await window.storage.get(key, shared);
        return r ? r.value : null;
      }
    }catch(e){}
    return localStorage.getItem(key);
  },
  async set(key, value, shared=true){
    try{
      if(window.storage) return await window.storage.set(key, value, shared);
    }catch(e){}
    return localStorage.setItem(key, value);
  },
  async list(prefix='', shared=true){
    try{
      if(window.storage){
        const r = await window.storage.list(prefix, shared);
        return r ? r.keys : [];
      }
    }catch(e){}
    const out=[];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(prefix)) out.push(k);
    }
    return out;
  }
};

const PIECE = {
  'P':'♙','N':'♘','B':'♗','R':'♖','Q':'♕','K':'♔',
  'p':'♟','n':'♞','b':'♝','r':'♜','q':'♛','k':'♚'
};

// ============== APP STATE ==============
const State = {
  user: null,                 // { id, name, rating }
  members: {},                // id -> {name, rating, wins, losses, draws}
  page: 'home',
  flipBoard: false,

  engineLevel: null,

  gameRated: false,

  gameBlack: null,
  gameStartFen: null,
  gameMoveHistory: [],        // SAN moves
  gameOver: false,
  promotionPending: null,     // {from, to, color}
  engine: null,               // Stockfish worker
  engineThinking: false,
  puzzleSolution: [],
  puzzleStep: 0,
  puzzleFeedback: null,
};

// ============== ELO ==============
function computeElo(rA, rB, scoreA, K=24){
  const eA = 1/(1+Math.pow(10,(rB-rA)/400));
  return Math.round(rA + K*(scoreA-eA));
}

// ============== MEMBERS ==============
async function loadMembers(){
  const raw = await storage.get('rk_members', true);
  if(raw){
    try{ State.members = JSON.parse(raw); }catch(e){ State.members = {}; }
  } else State.members = {};
}
async function saveMembers(){
  await storage.set('rk_members', JSON.stringify(State.members), true);
}
async function registerMember(name){
  const id = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  State.members[id] = { id, name, rating:1200, wins:0, losses:0, draws:0, joined:Date.now() };
  await saveMembers();
  return id;
}
async function setUser(id){
  State.user = State.members[id];
  await storage.set('rk_currentUser', id, true);
}
async function loadCurrentUser(){
  const id = await storage.get('rk_currentUser', true);
  if(id && State.members[id]) State.user = State.members[id];
}
async function logoutUser(){
  State.user = null;
  await storage.set('rk_currentUser', '', true);
}

// ============== GAME RECORDS ==============
async function saveGameRecord(record){
  const key = 'rk_game_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  await storage.set(key, JSON.stringify(record), true);
}
async function loadGameRecords(){
  const keys = await storage.list('rk_game_', true);
  const items = [];
  for(const k of keys){
    const raw = await storage.get(k, true);
    if(raw){ try{ items.push(JSON.parse(raw)); }catch(e){} }
  }
  return items.sort((a,b)=>b.ts-a.ts);
}

// ============== STOCKFISH ENGINE ==============
let stockfishLoading = null;
async function initStockfish(){
  if(State.engine) return State.engine;
  if(stockfishLoading) return stockfishLoading;
  stockfishLoading = (async()=>{
    try{
      const url = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
      const resp = await fetch(url);
      if(!resp.ok) throw new Error('Failed to fetch Stockfish');
      const code = await resp.text();
      const blob = new Blob([code], {type:'application/javascript'});
      const blobUrl = URL.createObjectURL(blob);
      const w = new Worker(blobUrl);
      State.engine = w;
      w.postMessage('uci');
      w.postMessage('isready');
      return w;
    }catch(e){
      console.error('Stockfish load failed:', e);
      throw e;
    }
  })();
  return stockfishLoading;
}

function configureEngine(level){
  // level: 1-5 with skill/depth presets, or {custom:elo}
  const w = State.engine; if(!w) return {depth:10};
  if(level && level.custom){
    w.postMessage('setoption name UCI_LimitStrength value true');
    w.postMessage('setoption name UCI_Elo value ' + Math.max(1320, Math.min(2850, level.custom)));
    return { depth: 14, movetime: 800 };
  }
  w.postMessage('setoption name UCI_LimitStrength value false');
  const presets = {
    1:{skill:0,  depth:1,  movetime:200, label:'Novice',     elo:'~800'},
    2:{skill:5,  depth:4,  movetime:300, label:'Apprentice', elo:'~1200'},
    3:{skill:10, depth:8,  movetime:500, label:'Journeyman', elo:'~1600'},
    4:{skill:15, depth:12, movetime:800, label:'Expert',     elo:'~2000'},
    5:{skill:20, depth:18, movetime:1500,label:'Grandmaster',elo:'~2500'}
  };
  const p = presets[level] || presets[3];
  w.postMessage('setoption name Skill Level value ' + p.skill);
  return p;
}

function askEngineForMove(fen, opts, callback){
  const w = State.engine; if(!w) return;
  State.engineThinking = true;
  const handler = (e)=>{
    const line = e.data;
    if(typeof line !== 'string') return;
    if(line.startsWith('bestmove')){
      const parts = line.split(/\s+/);
      const move = parts[1];
      State.engineThinking = false;
      w.removeEventListener('message', handler);
      callback(move);
    }
  };
  w.addEventListener('message', handler);
  w.postMessage('position fen ' + fen);
  if(opts.movetime) w.postMessage('go depth ' + (opts.depth||10) + ' movetime ' + opts.movetime);
  else w.postMessage('go depth ' + (opts.depth||10));
}

// ============== ROUTING ==============
function navigate(page, ctx){
  State.page = page;
  if(ctx) State.studyContext = ctx;
  // Reset game-state when leaving play pages
  if(!['vs-human','vs-engine','study-opening','study-trap','tactics-puzzle','endgame-study'].includes(page)){
    State.game = null;
    State.selectedSquare = null;
    State.legalDests = [];
    State.lastMove = null;
    State.gameOver = false;
    State.promotionPending = null;
  }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============== RENDER ==============
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

}

function renderStudyView(ctx, kind){
  const wrap = document.createElement('div');
  if(!ctx){ wrap.appendChild(el(`<p>Nothing selected. <a href="#" onclick="(()=>navigate('${kind==='opening'?'openings':'traps'}'))()">Return</a></p>`)); return wrap; }

  // Setup chess game with played moves up to studyStep
  const g = new Chess();
  for(let i=0;i<State.studyStep;i++) g.move(ctx.line[i].move);
  const lastMv = State.studyStep>0 ? lastMoveSquares(g) : null;

  const top = el(`<div style="margin-bottom:1rem">
    <button class="btn ghost sm" id="back">← Back</button>
    <div class="eyebrow" style="margin-top:.6rem">${kind==='opening'?'Opening Study':'Trap Study'}</div>
    <h1>${ctx.name}</h1>
    ${ctx.eco?`<div style="margin-top:.3rem"><span class="tag">${ctx.eco}</span> <span class="tag ${ctx.color==='White'?'gold':'green'}">${ctx.color}</span></div>`:''}
    <p style="margin-top:.6rem;max-width:65ch">${escapeHtml(ctx.summary)}</p>
  </div>`);
  top.querySelector('#back').onclick = ()=>navigate(kind==='opening'?'openings':'traps');
  wrap.appendChild(top);

  const layout = document.createElement('div'); layout.className='play-layout';

  // Board
  const boardWrap = document.createElement('div');
  const frame = document.createElement('div'); frame.className='board-frame';
  frame.appendChild(buildBoard(g, {flip:false, lastMove:lastMv, interactive:false}));
  boardWrap.appendChild(frame);
  layout.appendChild(boardWrap);

  // Sidebar
  const side = document.createElement('div'); side.className='play-sidebar';

  // Tutorial text
  const step = State.studyStep;
  const totalSteps = ctx.line.length;
  const tut = document.createElement('div'); tut.className='tutorial-text';

  if(step===0){
    tut.innerHTML = `
      <div class="step-counter">Move 0 of ${totalSteps}</div>
      <h3 style="margin-bottom:.4rem">Starting Position</h3>
      <p>${escapeHtml(ctx.summary)}</p>
      ${ctx.keyIdeas? `<hr class="fancy"/><div class="eyebrow">Key Ideas</div><ul style="margin-left:1.2rem">${ctx.keyIdeas.map(k=>`<li>${escapeHtml(k)}</li>`).join('')}</ul>`:''}
    `;
  } else {
    const cur = ctx.line[step-1];
    tut.innerHTML = `
      <div class="step-counter">Move ${step} of ${totalSteps}</div>
      <div class="move-played mono">${step}. ${cur.move}</div>
      <p>${escapeHtml(cur.text)}</p>
    `;
  }

  // Final summary
  if(step===totalSteps && kind==='trap' && ctx.avoid){
    tut.innerHTML += `<hr class="fancy"/><div class="eyebrow" style="color:var(--burgundy)">How to Avoid It</div><p style="margin-top:.4rem">${escapeHtml(ctx.avoid)}</p>`;
  }
  side.appendChild(tut);

  // Controls
  const ctrl = document.createElement('div'); ctrl.className='tutorial-controls';
  const prev = el(`<button class="btn ghost sm">◀ Previous</button>`);
  prev.disabled = step===0;
  prev.onclick = ()=>{ State.studyStep = Math.max(0, State.studyStep-1); render(); };
  const next = el(`<button class="btn gold sm">Next ▶</button>`);
  next.disabled = step>=totalSteps;
  next.onclick = ()=>{ State.studyStep = Math.min(totalSteps, State.studyStep+1); render(); };
  const reset = el(`<button class="btn ghost sm">Restart</button>`);
  reset.onclick = ()=>{ State.studyStep=0; render(); };
  const flip = el(`<button class="btn ghost sm">Flip</button>`);
  flip.onclick = ()=>{ State.flipBoard=!State.flipBoard; render(); };
  ctrl.appendChild(prev); ctrl.appendChild(next); ctrl.appendChild(reset); ctrl.appendChild(flip);
  side.appendChild(ctrl);

  // Move list
  const movesPanel = document.createElement('div'); movesPanel.className='moves-panel';
  movesPanel.innerHTML = '<h4>Move List</h4>';
  const ml = document.createElement('div'); ml.className='moves-list';
  for(let i=0;i<ctx.line.length;i+=2){
    const num = Math.floor(i/2)+1;
    const w = ctx.line[i]?.move || '';
    const b = ctx.line[i+1]?.move || '';
    const numEl = el(`<div class="num">${num}.</div>`);
    const wEl = el(`<div class="move ${i+1===step?'current':''}">${w}</div>`);
    const bEl = el(`<div class="move ${i+2===step?'current':''}">${b||''}</div>`);
    wEl.onclick = ()=>{ State.studyStep=i+1; render(); };
    if(b) bEl.onclick = ()=>{ State.studyStep=i+2; render(); };
    ml.appendChild(numEl); ml.appendChild(wEl); ml.appendChild(bEl);
  }
  movesPanel.appendChild(ml);
  side.appendChild(movesPanel);

  layout.appendChild(side);
  wrap.appendChild(layout);
  return wrap;
}

function handlePuzzleMove(move, ctx){
  // Check if SAN matches any solution
  const san = move.san;
  if(ctx.solution.includes(san) || ctx.solution.includes(san.replace('+','').replace('#',''))){
    State.puzzleFeedback = {kind:'correct', text:`✓ Correct! <strong>${san}</strong> ${escapeHtml(ctx.explanation)}`};
  } else {
    State.puzzleFeedback = {kind:'wrong', text:`✗ Not quite — <strong>${san}</strong> isn't the strongest move here. Try again or click "Show Answer".`};
    // Undo
    State.game.undo();
    State.lastMove = null;
  }
  render();
}

function renderVsHuman(){
  const wrap = document.createElement('div');

  const turn = game.turn(); // 'w' or 'b'
  const whiteMember = State.members[State.gameWhite];
  const blackMember = State.members[State.gameBlack];

  // Auto-flip board so the side to move is at the bottom (pass-and-play)
  const shouldFlip = turn==='b';

  wrap.appendChild(el(`<div style="margin-bottom:1rem">
    <button class="btn ghost sm" id="back">⟵ Resign / Leave</button>

  </div>`));
  wrap.querySelector('#back').onclick = ()=>{
    if(!State.gameOver && State.gameMoveHistory.length>0){
      if(!confirm('Resign and leave the game?')) return;
      // Resigning side loses
      const resigner = turn==='w' ? whiteMember.id : blackMember.id;

    }

    flip: shouldFlip,

    interactive: !State.gameOver && !State.promotionPending,

      State.gameMoveHistory.push(move.san);

    }
  }));

      <div class="captured white" id="capByWhite"></div>
    </div>
  `;

function checkHumanGameEnd(){
  if(State.gameOver) return;
  const g = State.game;
  if(g.in_checkmate()){
    // The side to move is checkmated
    const result = g.turn()==='w' ? '0-1' : '1-0';
    finishHumanGame(result, 'checkmate');
  } else if(g.in_draw() || g.in_stalemate() || g.in_threefold_repetition() || g.insufficient_material()){
    let r = 'draw';
    if(g.in_stalemate()) r='stalemate';
    else if(g.in_threefold_repetition()) r='threefold';
    else if(g.insufficient_material()) r='insufficient';
    else if(g.in_draw()) r='50-move';
    finishHumanGame('1/2-1/2', r);
  }
}

async function finishHumanGame(result, reason){
  State.gameOver = true;
  const w = State.members[State.gameWhite];
  const b = State.members[State.gameBlack];
  let scoreW = 0.5;
  let kind = 'draw';
  let text = `Drawn by ${reason}.`;
  if(result==='1-0'){ scoreW=1; kind='win'; text=`${w.name} wins by ${reason}!`; }
  else if(result==='0-1'){ scoreW=0; kind='loss'; text=`${b.name} wins by ${reason}!`; }

  // Update Elo if rated
  let newW=w.rating, newB=b.rating;
  if(State.gameRated){
    newW = computeElo(w.rating, b.rating, scoreW);
    newB = computeElo(b.rating, w.rating, 1-scoreW);
    State.members[State.gameWhite].rating = newW;
    State.members[State.gameBlack].rating = newB;
    if(scoreW===1){ State.members[State.gameWhite].wins++; State.members[State.gameBlack].losses++; }
    else if(scoreW===0){ State.members[State.gameWhite].losses++; State.members[State.gameBlack].wins++; }
    else { State.members[State.gameWhite].draws++; State.members[State.gameBlack].draws++; }
    await saveMembers();
    if(State.user.id===w.id) State.user.rating=newW;
    if(State.user.id===b.id) State.user.rating=newB;
    text += ` Elo: ${w.name} ${w.rating}→${newW} | ${b.name} ${b.rating}→${newB}.`;
  } else {
    text += ' (Friendly — no rating change.)';
  }
  State.lastResult = {kind, text};

  await saveGameRecord({
    ts: Date.now(),
    type: State.gameRated?'rated':'friendly',
    white: {id:w.id, name:w.name, ratingBefore:w.rating, ratingAfter:newW},
    black: {id:b.id, name:b.name, ratingBefore:b.rating, ratingAfter:newB},
    result, reason,
    moves: State.gameMoveHistory.slice(),
    pgn: State.game.pgn(),
  });

  render();
}

  card.innerHTML = `<div class="eyebrow">Preset Levels</div><h3 style="margin:.3rem 0 1rem">Choose a difficulty</h3>`;

  const grid = document.createElement('div'); grid.className='level-grid';
  const presets = [
    {n:1, name:'Novice',     elo:'~800'},
    {n:2, name:'Apprentice', elo:'~1200'},
    {n:3, name:'Journeyman', elo:'~1600'},
    {n:4, name:'Expert',     elo:'~2000'},
    {n:5, name:'Grandmaster',elo:'~2500'},
  ];
  let selectedLevel = State.engineLevel || 2;
  let useCustom = false;
  presets.forEach(p=>{
    const c = el(`<div class="level-card" data-n="${p.n}">
      <div class="lvl-num">${p.n}</div>
      <div class="lvl-name">${p.name}</div>
      <div class="lvl-elo">${p.elo}</div>
    </div>`);
    if(p.n===selectedLevel) c.classList.add('selected');
    c.onclick = ()=>{
      useCustom=false;
      [...grid.children].forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected');
      selectedLevel = p.n;
      customWrap.querySelector('.level-card')?.classList.remove('selected');
    };
    grid.appendChild(c);
  });
  card.appendChild(grid);

  card.appendChild(el(`<hr class="fancy"/>`));
  card.appendChild(el(`<div class="eyebrow">Or set a Custom Elo</div>`));

  const customWrap = document.createElement('div'); customWrap.style.display='flex';customWrap.style.gap='1rem';customWrap.style.alignItems='center';customWrap.style.marginTop='.7rem';
  const customCard = el(`<div class="level-card" style="flex:0 0 140px"><div class="lvl-num"><span id="customDisp">${State.engineCustomElo}</span></div><div class="lvl-name">Custom Elo</div><div class="lvl-elo">1320–2850</div></div>`);
  const slider = el(`<input type="range" min="1320" max="2850" value="${State.engineCustomElo}" step="20" style="flex:1" />`);
  slider.oninput = ()=>{
    customCard.querySelector('#customDisp').textContent = slider.value;
    State.engineCustomElo = +slider.value;
    [...grid.children].forEach(x=>x.classList.remove('selected'));
    customCard.classList.add('selected');
    useCustom=true;
  };
  customCard.onclick = ()=>{
    [...grid.children].forEach(x=>x.classList.remove('selected'));
    customCard.classList.add('selected');
    useCustom=true;
  };
  customWrap.appendChild(customCard); customWrap.appendChild(slider);
  card.appendChild(customWrap);

  card.appendChild(el(`<hr class="fancy"/>`));
  const colorRow = document.createElement('div');
  colorRow.innerHTML = `<label>Your colour</label>`;
  const tog = document.createElement('div'); tog.className='toggle-row';
  let myColor='white';
  ['white','black','random'].forEach(c=>{
    const b = document.createElement('button'); b.className='toggle-btn'; b.textContent=c;
    if(c==='white') b.classList.add('active');
    b.onclick=()=>{[...tog.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');myColor=c;};
    tog.appendChild(b);
  });
  colorRow.appendChild(tog);
  card.appendChild(colorRow);

  const start = el(`<button class="btn gold full" style="margin-top:1.4rem">Load Engine & Begin</button>`);
  start.onclick = async ()=>{
    start.disabled=true;
    start.innerHTML = '<span class="spinner"></span> Summoning the engine...';
    try{
      await initStockfish();
      const lvl = useCustom ? {custom:State.engineCustomElo} : selectedLevel;
      State.engineLevel = useCustom ? null : selectedLevel;
      State.engineThinking = false;
      State.gameOver = false;
      State.gameMoveHistory = [];
      State.lastMove = null;
      State.selectedSquare=null; State.legalDests=[];
      let pc = myColor;
      if(pc==='random') pc = Math.random()<.5?'white':'black';
      State.playerColor = pc==='white' ? 'w' : 'b';
      State.flipBoard = State.playerColor==='b';
      State.game = new Chess();
      State.vsMode = 'engine';
      State._engineConfig = configureEngine(lvl);
      State._engineLevelDisplay = useCustom ? `Custom Elo ${State.engineCustomElo}` : `Level ${selectedLevel} (${presets[selectedLevel-1].name})`;
      navigate('vs-engine');
      // If engine plays first
      if(State.playerColor==='b') setTimeout(()=>engineMakeMove(), 300);
    }catch(e){
      start.disabled=false;
      start.textContent='Load Engine & Begin';
      alert('Could not load Stockfish: '+e.message+'\nThis app needs internet access to fetch the engine on first use.');

  card.appendChild(start);
  wrap.appendChild(card);
  return wrap;
}

// ============== VS ENGINE GAME ==============
function renderVsEngine(){
  const wrap = document.createElement('div');
  if(!State.game) State.game = new Chess();
  const game = State.game;
  const turn = game.turn();

  wrap.appendChild(el(`<div style="margin-bottom:1rem">
    <button class="btn ghost sm" id="back">⟵ Leave Game</button>
    <div class="eyebrow" style="margin-top:.6rem">${State._engineLevelDisplay||'Stockfish'}</div>
    <h1>${escapeHtml(State.user.name)} <span style="color:var(--gold);font-style:italic">vs</span> Stockfish</h1>
  </div>`));
  wrap.querySelector('#back').onclick = ()=>{
    if(!State.gameOver && State.gameMoveHistory.length>0){
      if(!confirm('Leave the game? Stockfish games are not recorded.')) return;
    }
    navigate('play-menu');
  };

  const layout = document.createElement('div'); layout.className='play-layout';
  const boardCol = document.createElement('div');
  const frame = document.createElement('div'); frame.className='board-frame';
  frame.appendChild(buildBoard(game, {
    flip: State.flipBoard,
    lastMove: State.lastMove,
    interactive: !State.gameOver && !State.promotionPending && !State.engineThinking && turn===State.playerColor,
    onMove:(move)=>{
      State.gameMoveHistory.push(move.san);
      State.lastMove = lastMoveSquares(game);
      checkEngineGameEnd();
      render();
      if(!State.gameOver) setTimeout(()=>engineMakeMove(),200);
    }
  }));
  boardCol.appendChild(frame);
  layout.appendChild(boardCol);

  const side = document.createElement('div'); side.className='play-sidebar';

  if(State.gameOver){
    side.appendChild(el(`<div class="status-banner ${State.lastResult?.kind||'draw'}">${escapeHtml(State.lastResult?.text||'Game over')}</div>`));
  } else if(State.engineThinking){
    side.appendChild(el(`<div class="status-banner">Stockfish is thinking… <span class="spinner"></span></div>`));
  } else {
    const turnName = turn===State.playerColor ? State.user.name : 'Stockfish';
    side.appendChild(el(`<div class="status-banner">${escapeHtml(turnName)} to move</div>`));
  }

  const info = document.createElement('div'); info.className='game-info';
  const youColor = State.playerColor;
  const youAtTop = State.flipBoard ? false : (youColor==='b');
  info.innerHTML = `
    <div class="player-row ${turn===(youColor==='w'?'b':'w')?'active':''}">
      <div><span class="turn-marker"></span><span class="pname">Stockfish</span> <span class="badge elo">${State._engineLevelDisplay||''}</span></div>
      <div class="captured" id="capByEng"></div>
    </div>
    <div class="player-row ${turn===youColor?'active':''}">
      <div><span class="turn-marker"></span><span class="pname">${escapeHtml(State.user.name)} (${youColor==='w'?'White':'Black'})</span> <span class="badge elo">${State.user.rating}</span></div>
      <div class="captured" id="capByYou"></div>
    </div>
  `;
  const caps = computeCaptured(game);
  // captured BY white means pieces black has lost
  if(youColor==='w'){
    info.querySelector('#capByYou').textContent = caps.byWhite.join('');
    info.querySelector('#capByEng').textContent = caps.byBlack.join('');
  } else {
    info.querySelector('#capByYou').textContent = caps.byBlack.join('');
    info.querySelector('#capByEng').textContent = caps.byWhite.join('');
  }
  side.appendChild(info);

  side.appendChild(buildMovesPanel(State.gameMoveHistory));

  const ctrl = document.createElement('div'); ctrl.className='tutorial-controls';
  const undo = el(`<button class="btn ghost sm">↶ Take Back</button>`);
  undo.disabled = State.gameMoveHistory.length<2 || State.gameOver || State.engineThinking;
  undo.onclick = ()=>{
    State.game.undo(); State.gameMoveHistory.pop();
    State.game.undo(); State.gameMoveHistory.pop();
    State.lastMove = lastMoveSquares(State.game);
    render();
  };
  const flipBtn = el(`<button class="btn ghost sm">Flip</button>`);
  flipBtn.onclick = ()=>{State.flipBoard=!State.flipBoard;render();};
  const resign = el(`<button class="btn danger sm">Resign</button>`);
  resign.disabled = State.gameOver;
  resign.onclick = ()=>{
    if(!confirm('Resign?')) return;
    State.gameOver = true;
    State.lastResult = {kind:'loss', text:'You resigned. Stockfish wins.'};
    render();
  };
  const newG = el(`<button class="btn ghost sm">New Game</button>`);
  newG.onclick = ()=>navigate('vs-engine-setup');
  ctrl.appendChild(undo); ctrl.appendChild(flipBtn); ctrl.appendChild(resign); ctrl.appendChild(newG);
  side.appendChild(ctrl);

  layout.appendChild(side);
  wrap.appendChild(layout);
  return wrap;
}

function checkEngineGameEnd(){
  const g = State.game;
  if(g.in_checkmate()){
    const winner = g.turn()==='w' ? 'b' : 'w';
    const youWon = winner === State.playerColor;
    State.gameOver = true;
    State.lastResult = {kind: youWon?'win':'loss', text: youWon?'Checkmate! You defeated the engine!':'Checkmate. Stockfish wins.'};
  } else if(g.in_draw() || g.in_stalemate() || g.in_threefold_repetition() || g.insufficient_material()){
    State.gameOver = true;
    let r='draw';
    if(g.in_stalemate()) r='stalemate';
    else if(g.in_threefold_repetition()) r='threefold repetition';
    else if(g.insufficient_material()) r='insufficient material';
    State.lastResult = {kind:'draw', text:`Drawn by ${r}.`};
  }
}

function engineMakeMove(){
  if(State.gameOver) return;
  const g = State.game;
  if(g.turn()===State.playerColor) return;
  const opts = State._engineConfig || {depth:10};
  askEngineForMove(g.fen(), opts, (uci)=>{
    if(!uci || uci==='(none)') return;
    const from = uci.slice(0,2);
    const to = uci.slice(2,4);
    const promotion = uci.length>4 ? uci.slice(4,5) : undefined;
    const m = g.move({from, to, promotion});
    if(m){
      State.gameMoveHistory.push(m.san);
      State.lastMove = {from:m.from, to:m.to};
      checkEngineGameEnd();
    }
    render();
  });
}

function showGameModal(r){

  </div>`);

function formatPGN(moves){
  let s='';
  for(let i=0;i<moves.length;i+=2){
    s += `${i/2+1}. ${moves[i]||''} ${moves[i+1]||''} `;
  }
  return s.trim() || '<em>(no moves)</em>';
}

// ============== BOARD BUILDER ==============
function buildBoard(game, options){
  const {flip, lastMove, interactive, onMove} = options;
  const board = document.createElement('div'); board.className='board';
  const ranks = flip ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const files = flip ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];
  const checkSq = game.in_check() ? findKingSquare(game, game.turn()) : null;

  for(const r of ranks){
    for(const f of files){
      const sq = f+r;
      const isLight = (files.indexOf(f) + ranks.indexOf(r)) % 2 === (flip?1:1) ; // recomputed below
      const fIdx = 'abcdefgh'.indexOf(f);
      const rIdx = r-1;
      const isLightSq = (fIdx + rIdx) % 2 === 1;
      const cell = document.createElement('div');
      cell.className = 'square ' + (isLightSq?'light':'dark');
      cell.dataset.square = sq;

      // coordinates on edges
      if((flip && r===1) || (!flip && r===1)){
        const c = document.createElement('span'); c.className='coord file'; c.textContent=f; cell.appendChild(c);
      }
      if((flip && f==='h') || (!flip && f==='a')){
        const c = document.createElement('span'); c.className='coord rank'; c.textContent=r; cell.appendChild(c);
      }

      // last move highlight
      if(lastMove && (lastMove.from===sq || lastMove.to===sq)) cell.classList.add('last-move');

      // selected highlight
      if(State.selectedSquare===sq) cell.classList.add('selected');

      // legal dest highlight
      if(State.legalDests.includes(sq)){
        // capture vs quiet
        if(game.get(sq)) cell.classList.add('legal-capture');
        else cell.classList.add('legal');
      }

      // check indicator
      if(checkSq===sq) cell.classList.add('check');

      // piece
      const piece = game.get(sq);
      if(piece){
        const span = document.createElement('span');
        span.className = 'piece ' + (piece.color==='w'?'white':'black');
        const code = piece.color==='w' ? piece.type.toUpperCase() : piece.type.toLowerCase();
        span.textContent = PIECE[code];
        cell.appendChild(span);
      }

      if(interactive){
        cell.onclick = ()=>handleSquareClick(sq, game, onMove);
      }
      board.appendChild(cell);
    }
  }
  return board;
}

function handleSquareClick(sq, game, onMove){
  if(State.promotionPending) return;
  const piece = game.get(sq);
  // If we have selection and clicking on legal dest -> move
  if(State.selectedSquare && State.legalDests.includes(sq)){
    const moveObj = {from:State.selectedSquare, to:sq};
    // check for promotion
    const movingPiece = game.get(State.selectedSquare);
    if(movingPiece && movingPiece.type==='p' && (sq[1]==='8'||sq[1]==='1')){
      State.promotionPending = {from:State.selectedSquare, to:sq, color:movingPiece.color, onComplete:onMove};
      State.selectedSquare=null; State.legalDests=[];
      render();
      showPromotionPicker();
      return;
    }
    const result = game.move(moveObj);
    State.selectedSquare = null;
    State.legalDests = [];
    if(result){
      State.lastMove = {from:result.from, to:result.to};
      onMove(result);
    } else {
      render();
    }
    return;
  }
  // Otherwise try selecting
  if(piece && piece.color===game.turn()){
    State.selectedSquare = sq;
    State.legalDests = game.moves({square:sq, verbose:true}).map(m=>m.to);
    render();
  } else {
    State.selectedSquare = null;
    State.legalDests = [];
    render();
  }
}

function showPromotionPicker(){
  const p = State.promotionPending; if(!p) return;
  const overlay = el(`<div class="promo-picker">
    <div class="promo-card">
      ${['q','r','b','n'].map(t=>`<div class="promo-piece" data-t="${t}">${PIECE[p.color==='w'?t.toUpperCase():t]}</div>`).join('')}
    </div>
  </div>`);
  overlay.querySelectorAll('.promo-piece').forEach(pe=>{
    pe.onclick = ()=>{
      const promo = pe.dataset.t;
      const result = State.game.move({from:p.from, to:p.to, promotion:promo});
      State.promotionPending = null;
      overlay.remove();
      if(result){
        State.lastMove = {from:result.from, to:result.to};
        if(p.onComplete) p.onComplete(result);
        else render();
      } else render();
    };
  });
  document.getElementById('app').appendChild(overlay);
}

function lastMoveSquares(game){
  const h = game.history({verbose:true});
  if(h.length===0) return null;
  const m = h[h.length-1];
  return {from:m.from, to:m.to};
}

function findKingSquare(game, color){
  const board = game.board();
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(p && p.type==='k' && p.color===color){
      return 'abcdefgh'[c] + (8-r);
    }
  }
  return null;
}

function gameStatus(game){
  return {
    check: game.in_check(),
    checkmate: game.in_checkmate(),
    stalemate: game.in_stalemate(),
    draw: game.in_draw(),
  };
}

function computeCaptured(game){
  // From history
  const byWhite=[]; const byBlack=[];
  game.history({verbose:true}).forEach(m=>{
    if(m.captured){
      if(m.color==='w') byWhite.push(PIECE[m.captured.toLowerCase()]);
      else byBlack.push(PIECE[m.captured.toUpperCase()]);
    }
  });
  return {byWhite, byBlack};
}

function buildMovesPanel(moves){
  const panel = document.createElement('div'); panel.className='moves-panel';
  panel.innerHTML = '<h4>Moves</h4>';
  const ml = document.createElement('div'); ml.className='moves-list';
  if(moves.length===0){
    ml.appendChild(el(`<div class="num"></div><div class="small italic" style="grid-column:span 2;color:var(--ink-soft)">No moves yet.</div>`));
  } else {
    for(let i=0;i<moves.length;i+=2){
      const num = i/2+1;
      ml.appendChild(el(`<div class="num">${num}.</div>`));
      ml.appendChild(el(`<div class="move">${moves[i]||''}</div>`));
      ml.appendChild(el(`<div class="move">${moves[i+1]||''}</div>`));
    }
  }
  panel.appendChild(ml);
  // scroll bottom
  setTimeout(()=>{ panel.scrollTop = panel.scrollHeight; },0);
  return panel;
}

// ============== UTIL ==============
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'});
}

(async ()=>{
  await loadMembers();
  await loadCurrentUser();
  render();
})();
